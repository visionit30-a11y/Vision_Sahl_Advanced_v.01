name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      # The version comes from apps/api/.python-version, the same file uv reads,
      # so the machine, CI and the future production image read one source.
      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      # Blocking on its own: a lock that drifted from pyproject would mean CI
      # installs a tree nobody reviewed.
      - name: Dependency lock is consistent
        run: uv lock --check

      # --frozen installs exactly what the lock records and refuses to resolve
      # anything, so this run and every later run get the same tree.
      - name: Install from the lock
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # The version comes from apps/web/.nvmrc so the local machine and CI read
      # one source instead of two numbers that have to be kept equal by hand.
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "A .env file is tracked by git."
            exit 1
          fi
          echo "No tracked .env file."
